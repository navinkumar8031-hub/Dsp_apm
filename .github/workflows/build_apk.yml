name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Flutter Project Structure
        run: |
          mkdir temp_src
          cp -r lib temp_src/
          cp pubspec.yaml temp_src/
          flutter create --org com.example --project-name dsp_app .
          cp -r temp_src/lib .
          cp temp_src/pubspec.yaml .
          rm -rf temp_src

      - name: Inject Bluetooth Permissions to Manifest
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Standalone Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NV-AUDIO-DSP-Release
          path: build/app/outputs/flutter-apk/app-release.apk
